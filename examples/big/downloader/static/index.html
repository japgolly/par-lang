<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Par Downloader</title>
  <style>
    body { font-family: ui-monospace, monospace; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
    input { font: inherit; min-width: 0; }
    #url { flex: 3; }
    #name { flex: 1; }
    h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; }
    #active { list-style: none; padding: 0; margin: 0; }
    #active li { border: 1px solid #999; padding: .5rem; margin-bottom: .5rem; }
    .row { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
    .name { font-weight: bold; overflow-wrap: anywhere; }
    .stats { color: #555; }
    progress { width: 100%; margin-top: .35rem; }
    #empty { color: #888; font-style: italic; }
    #log { border: 1px solid #999; height: 30vh; overflow-y: auto; padding: .5rem; }
    #log p { margin: .15rem 0; white-space: pre-wrap; }
    .finished { color: #26734d; }
    .failed { color: #b3261e; }
    .system { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>⅋ downloader</h1>
  <form id="start">
    <input id="url" type="url" placeholder="https://example.com/file.zip" required autofocus>
    <input id="name" placeholder="file name (optional)">
    <button>Download</button>
  </form>

  <h2>Downloading</h2>
  <p id="empty">Nothing right now.</p>
  <ul id="active"></ul>

  <h2>Log</h2>
  <div id="log"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const downloads = new Map();  // name -> { item, expected, downloaded, lastBytes, lastTime, speed }

    function bytes(n) {
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
      return `${i === 0 ? n : n.toFixed(1)} ${units[i]}`;
    }

    function log(line, kind) {
      const p = document.createElement("p");
      p.textContent = `[${new Date().toLocaleTimeString()}] ${line}`;
      if (kind) p.className = kind;
      $("log").append(p);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function render(name) {
      const d = downloads.get(name);
      const bar = d.item.querySelector("progress");
      const stats = d.item.querySelector(".stats");
      if (d.expected === undefined) {
        bar.removeAttribute("value");
        stats.textContent = "connecting…";
        return;
      }
      if (d.expected > 0) {
        bar.max = d.expected;
        bar.value = d.downloaded;
      } else {
        bar.removeAttribute("value");
      }
      const total = d.expected > 0 ? ` / ${bytes(d.expected)}` : "";
      const speed = d.speed !== undefined ? ` · ${bytes(d.speed)}/s` : "";
      stats.textContent = `${bytes(d.downloaded)}${total}${speed}`;
    }

    function add(name) {
      const item = document.createElement("li");
      item.innerHTML = `
        <div class="row">
          <span class="name"></span>
          <button>Cancel</button>
        </div>
        <div class="stats"></div>
        <progress></progress>`;
      item.querySelector(".name").textContent = name;
      const button = item.querySelector("button");
      button.onclick = async () => {
        button.disabled = true;
        button.textContent = "Cancelling…";
        const response = await fetch(`/downloads/${encodeURIComponent(name)}`, { method: "DELETE" });
        if (!response.ok) log(await response.text(), "failed");
      };
      $("active").append(item);
      $("empty").hidden = true;
      downloads.set(name, { item, downloaded: 0 });
      render(name);
    }

    function remove(name) {
      downloads.get(name)?.item.remove();
      downloads.delete(name);
      $("empty").hidden = downloads.size > 0;
    }

    const socket = new WebSocket(`ws://${location.host}/ws`);

    socket.onmessage = (message) => {
      const notice = JSON.parse(message.data);
      const { kind, name } = notice;
      const d = downloads.get(name);
      switch (kind) {
        case "added":
          add(name);
          break;
        case "started":
          d.expected = notice.size;
          render(name);
          break;
        case "progressed": {
          const now = performance.now();
          // The speed needs two progress notices, the first only sets a baseline.
          if (d.lastTime !== undefined && now > d.lastTime) {
            const rate = (notice.downloaded - d.lastBytes) * 1000 / (now - d.lastTime);
            d.speed = d.speed === undefined ? rate : 0.7 * d.speed + 0.3 * rate;
          }
          d.downloaded = notice.downloaded;
          d.lastBytes = notice.downloaded;
          d.lastTime = now;
          render(name);
          break;
        }
        case "finished": {
          remove(name);
          const seconds = notice.millis / 1000;
          const speed = seconds > 0 ? ` (${bytes(notice.size / seconds)}/s)` : "";
          log(`Finished ${name}: ${bytes(notice.size)} in ${seconds.toFixed(1)} s${speed}`, "finished");
          break;
        }
        case "failed":
          remove(name);
          log(`Failed ${name}: ${notice.error}`, "failed");
          break;
        case "cancelled":
          remove(name);
          log(`Cancelled ${name}`, "system");
          break;
      }
    };

    socket.onclose = () => {
      log("Disconnected from the server.", "system");
      for (const button of document.querySelectorAll("button")) button.disabled = true;
    };

    $("start").onsubmit = async (event) => {
      event.preventDefault();
      const url = $("url").value.trim();
      const name = $("name").value.trim()
        || decodeURIComponent(new URL(url).pathname.split("/").pop() || "")
        || "download";
      const response = await fetch(`/downloads/${encodeURIComponent(name)}`, { method: "POST", body: url });
      if (response.ok) {
        $("url").value = "";
        $("name").value = "";
      } else {
        log(await response.text(), "failed");
      }
    };
  </script>
</body>
</html>
