[workspace]
members = ["crates/par-core", "crates/par-builtin", "crates/par-doc"]

[package]
name = "par-lang"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/par-team/par-lang"

[[bin]]
name = "par"
path = "src/main.rs"

[features]
default = ["playground"]
playground = ["eframe", "egui_code_editor", "rfd", "par-core/playground", "par-runtime/playground"]

[dependencies]
par-core = { path = "crates/par-core" }
par-builtin = { path = "crates/par-builtin" }
par-runtime = { path = "crates/par-runtime" }
par-doc = { path = "crates/par-doc" }
futures = { version = "0.3.34", features = ["executor", "thread-pool"] }
eframe = { version = "0.36.2", features = ["default", "__screenshot"], optional = true }
egui_code_editor = { version = "0.4.2", optional = true }
indexmap = "2.14.2"
rfd = { version = "0.17.2", optional = true }
winnow = { version = "1.0.4", features = [
    #"unstable-doc", # build docs locally
    #"debug" # debug output/state of parser
] }
miette = { version = "7.6.0", features = ["fancy"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.7", features = ["cargo"] }
colored = "3.1.1"
arcstr = "1.2.0"
num-bigint = "0.5.1"
unescaper = "0.2.0"
tokio-util = "0.7.20"
scopeguard = "1.2.0"
wild = "2.2.1"
reqwest = { version = "0.13.5", features = ["stream", "gzip", "brotli", "deflate"] }
bytes = "1.12.1"
im = "15.1.0"
url = "2.5.8"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
http-body = "1.1.0"
num-traits = "0.2.19"
percent-encoding = "2.3.2"
bincode = { version = "2.0.1", features = ["serde"] }
webbrowser = "1.2.4"

[package.metadata.spellcheck]
config = ".config/spellcheck.toml"

[profile.release]
lto = "thin"
codegen-units = 1

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.52"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "io-util"] }
log = "0.4.34"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = [
    "Clipboard",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Navigator",
    "Window",
] }
