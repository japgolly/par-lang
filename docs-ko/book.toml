[book]
title = "Par 프로그래밍 언어"
authors = ["s15n", "EatChangmyeong"]
description = "Par 프로그래밍 언어의 공식 문서"
src = "src"
language = "ko"

[build]
use-default-preprocessors = false
create-missing = false

[preprocessor.links]

[output.html]
theme = "par-theme"
additional-js = ["par-theme/language-switcher.js"]
additional-css = ["par-theme/language-switcher.css"]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/par-team/par-lang/tree/main/docs-ko"
mathjax-support = true
edit-url-template = "https://github.com/par-team/par-lang/edit/main/docs-ko/{path}"

[output.html.code.hidelines]
par = "# "

[output.linkcheck2]
