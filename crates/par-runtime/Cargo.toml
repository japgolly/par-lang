[package]
name = "par-runtime"
version = "0.1.0"
edition = "2024"

[features]
playground=[]

[dependencies]
arcstr = { version = "1.2.0", features = ["serde"] }
futures = { version = "0.3.34", features = ["executor", "thread-pool"] }
num-bigint = { version = "0.5.1", features = ["serde"] }
bytes = { version = "1.12.1", features = ["serde"] }
bytes-utils = { version = "0.1.4", features = ["serde"] }
inventory = "0.3.25"
serde = { version = "1.0.229", features = ["derive", "rc"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal", "sync"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "io-util", "sync"] }
