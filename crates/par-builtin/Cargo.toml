[package]
name = "par-builtin"
version = "0.1.0"
edition = "2024"

[dependencies]
par-core = { path = "../par-core" }
par-runtime = { path = "../par-runtime" }

arcstr = "1.2.0"
bytes = "1.12.1"
futures = { version = "0.3.34", features = ["executor", "thread-pool"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
im = "15.1.0"
indexmap = "2.14.2"
jiff = { version = "0.2.38", features = ["tzdb-bundle-always"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
num-integer = "0.1.47"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream", "gzip", "brotli", "deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"
inventory = "0.3.25"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "io-util"] }
